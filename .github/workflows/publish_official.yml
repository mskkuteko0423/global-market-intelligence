
name: Publish Official Articles

on:
  workflow_dispatch:
  schedule:
    - cron: '35 22 * * *'

permissions:
  contents: write

concurrency:
  group: gmi-official-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Backup previous articles
        run: |
          if [ -f data/official_pilot.json ]; then
            cp data/official_pilot.json /tmp/gmi_previous_official.json
          fi

      - name: Collect and translate
        run: python official_pilot.py

      - name: Merge article history
        run: python archive_official.py

      - name: Verify archive
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/official_pilot.json")
          data = json.loads(p.read_text(encoding="utf-8"))

          assert data.get("archive_enabled") is True
          assert len(data["articles"]) > 0

          print("Archive count:", len(data["articles"]))
          PY

      - name: Publish data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add data/official_pilot.json data/official_pilot_preview.html

          if ! git diff --cached --quiet; then
            git commit -m 'Update official article archive'
            git push
          else
            echo 'No changes'
          fi
