name: Test Official Articles

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-official-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run official article pilot
        run: python official_pilot.py
      - name: Upload pilot results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-pilot-results
          path: data/official_pilot.json
          if-no-files-found: warn
