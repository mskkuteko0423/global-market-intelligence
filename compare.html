<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10213c"><title>AI・半導体比較 | GMI</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#18263e;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}header{background:#10213c;color:white;padding:22px 16px}header .inner,main{max-width:1050px;margin:auto}h1{font-size:22px;margin:8px 0}header p{font-size:13px;color:#c4d1e5}header a{color:#dbe8ff}main{padding:18px 14px 70px}.panel,.firm{background:white;border:1px solid #dce4f0;border-radius:14px;padding:16px;margin-bottom:14px}.muted{color:#66748a;font-size:13px;line-height:1.6}.filters{display:grid;grid-template-columns:1fr 1fr;gap:9px}select,input,button{font:inherit;padding:11px;border:1px solid #ccd5e3;border-radius:9px;min-width:0;background:white;color:#18263e}input{grid-column:1/-1}button{background:#193f79;color:white;border:0}.stats{display:flex;gap:10px;flex-wrap:wrap}.stats span{background:#eef3fa;border-radius:8px;padding:8px 11px;font-size:13px}.firm h2{font-size:17px;margin:0 0 8px}.article{border-top:1px solid #e7edf5;padding:12px 0}.article:first-of-type{border-top:0}.article a{color:#1357a5;overflow-wrap:anywhere;font-weight:650}.meta{font-size:12px;color:#66748a;margin:6px 0}.desc{font-size:13px;line-height:1.6;color:#46566e}.tag{display:inline-block;background:#eef3fa;padding:4px 7px;border-radius:6px;font-size:11px;margin:3px 3px 3px 0}.warning{background:#fff7df;border-radius:9px;padding:12px;font-size:13px;line-height:1.7}.empty{padding:18px;color:#66748a;text-align:center}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}small{font-size:12px}#status{margin-bottom:12px}@media(min-width:760px){.filters{grid-template-columns:1.5fr 1fr 1fr}input{grid-column:auto}}</style></head><body><header><div class="inner"><a href="./">← GMI トップへ</a><h1>AI・半導体 レポート比較</h1><p>金融機関別の関連記事・時系列比較（追加API費用なし）</p></div></header><main><div class="panel"><div class="warning">Google News検索フィードの見出し・説明文に基づく一覧です。公式レポート本文を検証したものではなく、各社の強気・弱気判断を示すものではありません。</div><p class="muted" id="status">収集データを読み込み中…</p><div class="stats" id="stats"></div></div><div class="panel"><div class="filters"><input id="q" placeholder="自由検索（NVIDIA、GPU、電力など）"><select id="theme"><option value="all">AI・半導体全般</option><option value="chips">半導体・GPU</option><option value="infra">データセンター・電力</option><option value="spend">設備投資・収益化</option><option value="risk">規制・リスク</option></select><select id="sort"><option value="recent">各社の新しい順</option><option value="count">記事件数が多い順</option><option value="name">金融機関名順</option></select></div></div><div id="firms"></div></main><script>const $=id=>document.getElementById(id);let articles=[],sources=[];const groups={chips:/semiconductor|chip\b|chips\b|gpu\b|nvidia|nvda|hbm|memory chip|tsmc|foundry|半導体/i,infra:/data cent(?:er|re)|hyperscal|electricity|power grid|power demand|energy demand|データセンター|電力/i,spend:/capex|capital expenditure|ai investment|monetiz|return on investment|roi\b|infrastructure spending|設備投資|収益化/i,risk:/regulat|export control|restriction|risk|bubble|valuation|規制|リスク|バブル/i};const ai=/artificial intelligence|\bai\b|generative ai|\bgenai\b|\bllm\b|semiconductor|\bchip\b|\bgpu\b|nvidia|nvda|data cent(?:er|re)|hyperscal|hbm|tsmc|半導体|人工知能|データセンター/i;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function safe(u){try{const x=new URL(u);return ['http:','https:'].includes(x.protocol)?x.href:'#'}catch{return '#'}}function render(){const theme=$('theme').value,q=$('q').value.trim().toLowerCase();const filtered=articles.filter(a=>{const s=[a.title,a.description,a.firm].join(' ');return ai.test(s)&&(theme==='all'||groups[theme].test(s))&&(!q||s.toLowerCase().includes(q))});const by=new Map(sources.map(s=>[s.name,[]]));for(const a of filtered){if(!by.has(a.firm))by.set(a.firm,[]);by.get(a.firm).push(a)}let rows=[...by].map(([name,list])=>({name,list:list.sort((a,b)=>String(b.published||'').localeCompare(String(a.published||'')))}));if($('sort').value==='count')rows.sort((a,b)=>b.list.length-a.list.length||a.name.localeCompare(b.name));else if($('sort').value==='name')rows.sort((a,b)=>a.name.localeCompare(b.name));else rows.sort((a,b)=>String(b.list[0]?.published||'').localeCompare(String(a.list[0]?.published||''))||b.list.length-a.list.length);$('stats').innerHTML=`<span>対象記事：<b>${filtered.length}</b>件</span><span>関連記事のある機関：<b>${rows.filter(x=>x.list.length).length}</b>社</span><span>収集対象：<b>${sources.length}</b>社</span>`;$('firms').innerHTML=rows.map(({name,list})=>`<section class="firm"><div class="row"><h2>${esc(name)}</h2><small>${list.length}件</small></div>${list.length?list.map(a=>`<div class="article"><div class="meta">${esc(a.published||'日付不明')} <span class="tag">${esc(a.origin||'検索フィード・未検証')}</span></div><a href="${esc(safe(a.url))}" target="_blank" rel="noopener noreferrer">${esc(a.title)}</a>${a.description?`<div class="desc">${esc(a.description)}</div>`:''}</div>`).join(''):'<div class="muted">該当する記事はありません。</div>'}</section>`).join('')||'<div class="empty">一致する記事がありません。</div>'}async function load(){try{const r=await fetch('./data/reports.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();articles=Array.isArray(d.articles)?d.articles:[];sources=Array.isArray(d.sources)?d.sources:[];$('status').textContent=`収録 ${articles.length} 件／最終更新：${d.updated?new Date(d.updated).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}):'不明'}（日本時間）`;render()}catch(e){$('status').textContent='読み込み失敗：'+e.message+'。トップページのデータ公開状況を確認してください。'}}for(const id of ['q','theme','sort'])$(id).addEventListener(id==='q'?'input':'change',render);load();</script></body></html>
